[package]
name = "calculator_api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
rust_decimal = { version = "1.43.0", features = ["maths"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["arbitrary_precision"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1.5"
proptest = "1.12.0"
tower = { version = "0.5.3", features = ["util"] }

# ADR-0004 / NFR-4: no panics on request data outside tests.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
